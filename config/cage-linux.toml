# Default bundled configuration for cage (Linux)
# This is embedded in the binary via include_str!

[policies.default]
writable_roots = ["$CWD"]
write_restricted_paths = ["$CWD/.git", "$CWD/.env"]
read_restricted_paths = ["~/.ssh", "~/.aws", "~/.gnupg"]
network = "full"
enable_gui = true
enable_audio = true

[policies.default.env]
mode = "default_allow"
block = ["*_TOKEN", "*_SECRET", "*_PASSWORD", "*_API_KEY", "AWS_*", "GITHUB_*"]
set = { CAGE = "1" }

[policies.strict]
writable_roots = ["$CWD"]
write_restricted_paths = ["$CWD/.git", "$CWD/.env"]
read_restricted_paths = ["~/.ssh", "~/.aws", "~/.config", "~/.gnupg"]
network = "none"
enable_gui = false
enable_audio = false

[policies.strict.env]
mode = "default_block"
allow = ["PATH"]
set = { CAGE = "1" }

[[command_policy]]
pattern = "opencode"
policy = "default"

[[command_policy]]
pattern = "codex"
policy = "default"

[[command_policy]]
pattern = "claude"
policy = "default"

[[command_policy]]
pattern = "aider"
policy = "strict"

[platform]
fail_on_sandbox_error = true
