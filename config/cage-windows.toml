# Default bundled configuration for cage (Windows)
# This is embedded in the binary via include_str!

[policies.default]
writable_roots = ["$CWD", "$TEMP", "$LOCALAPPDATA"]
write_restricted_paths = ["$CWD/.git", "$CWD/.env", "$APPDATA", "$USERPROFILE/.ssh"]
read_restricted_paths = ["$USERPROFILE/.ssh", "$USERPROFILE/.aws", "$APPDATA"]
network = "full"
enable_gui = true
enable_audio = true

[policies.default.env]
mode = "blocklist"
block = ["*_TOKEN", "*_SECRET", "*_PASSWORD", "*_API_KEY", "AWS_*", "GITHUB_*"]
set = { CAGE = "1" }

[policies.strict]
writable_roots = ["$CWD"]
write_restricted_paths = ["$CWD/.git", "$CWD/.env"]
read_restricted_paths = ["$USERPROFILE/.ssh", "$USERPROFILE/.aws", "$APPDATA"]
network = "none"
enable_gui = true
enable_audio = true

[policies.strict.env]
mode = "allowlist"
allow = ["PATH"]
set = { CAGE = "1" }

[[command_policy]]
pattern = "opencode"
policy = "default"

[[command_policy]]
pattern = "codex"
policy = "default"

[[command_policy]]
pattern = "claude"
policy = "default"

[[command_policy]]
pattern = "aider"
policy = "strict"

[platform]
fail_on_sandbox_error = true
cage_group = "CageUsers"
